---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</p>

  <div class="post-content">
    {{ content }}
  </div>
<!-- Social Sharing -->
<div class="share-buttons" style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #ddd;">
  <p style="font-weight: bold; margin-bottom: 10px;">Share this project:</p>
  <a href="https://pinterest.com/pin/create/button/?url={{ site.url }}{{ page.url }}&description={{ page.title | url_encode }}" target="_blank" style="display: inline-block; margin-right: 15px; text-decoration: none; color: #cb2027;">📌 Pinterest</a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url }}" target="_blank" style="display: inline-block; margin-right: 15px; text-decoration: none; color: #1877f2;">📘 Facebook</a>
  <a href="https://api.whatsapp.com/send?text={{ page.title | url_encode }}%20{{ site.url }}{{ page.url }}" target="_blank" style="display: inline-block; text-decoration: none; color: #25d366;">📱 WhatsApp</a>
</div>
</div>
</article>
