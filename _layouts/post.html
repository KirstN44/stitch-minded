<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</p>

  <div class="post-content">
    {{ content }}
  </div>

  <!-- Comments Section -->
  <section class="comments-section" style="margin-top: 3rem;">
    <h3>Comments</h3>
    <!-- Your Giscus or Utterances script tag goes here -->
  </section>
</article>
